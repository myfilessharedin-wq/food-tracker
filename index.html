<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>Моя еда</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top">
    <div>
      <h1>Моя еда</h1>
      <div id="weekLabel" class="week-label"></div>
    </div>

    <button id="todayBtn" class="secondary-btn">
      Сегодня
    </button>
  </header>


  <main>

    <section class="week-navigation">
      <button id="prevWeek">‹</button>

      <div id="currentWeek"></div>

      <button id="nextWeek">›</button>
    </section>


    <section class="summary">

      <div class="summary-card">
        <span>Неделя</span>
        <strong id="weekTotal">0 ₽</strong>
      </div>

      <div class="summary-card">
        <span>Дней запланировано</span>
        <strong id="plannedDays">0</strong>
      </div>

    </section>


    <section class="planner">

      <div class="planner-header">
        <div>День</div>
        <div>Завтрак</div>
        <div>Обед</div>
        <div>Ужин</div>
      </div>

      <div id="plannerBody"></div>

    </section>


    <section class="catalog-section">

      <div class="section-title">
        <h2>Мои блюда</h2>

        <button id="addFoodBtn" class="add-btn">
          + Блюдо
        </button>
      </div>

      <div id="foodList" class="food-list"></div>

    </section>

  </main>


  <!-- Модальное окно блюда -->

  <div id="foodModal" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Новое блюдо</h2>

        <button class="close-btn" id="closeFoodModal">
          ×
        </button>
      </div>

      <label>
        Название блюда
        <input id="foodName" type="text" placeholder="Например, паста с курицей">
      </label>

      <label>
        Магазин
        <input id="foodStore" type="text" placeholder="Например, ВкусВилл">
      </label>

      <label>
        Цена
        <input id="foodPrice" type="number" min="0" step="1" placeholder="399">
      </label>

      <label>
        Комментарий
        <textarea id="foodComment" placeholder="Например, любимая паста"></textarea>
      </label>

      <button id="saveFoodBtn" class="primary-btn">
        Сохранить блюдо
      </button>

    </div>

  </div>


  <!-- Модальное окно планирования -->

  <div id="mealModal" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">

        <div>
          <h2 id="mealModalTitle">Добавить еду</h2>
          <div id="mealModalDate" class="modal-date"></div>
        </div>

        <button class="close-btn" id="closeMealModal">
          ×
        </button>

      </div>


      <div class="person-buttons">

        <button class="person-btn" data-person="me">
          Мне
        </button>

        <button class="person-btn" data-person="husband">
          Мужу
        </button>

        <button class="person-btn" data-person="both">
          Нам обоим
        </button>

      </div>


      <label>
        Блюдо

        <select id="mealFood">
          <option value="">Выберите блюдо</option>
        </select>

      </label>


      <button id="saveMealBtn" class="primary-btn">
        Добавить в план
      </button>


      <div id="existingMeals" class="existing-meals"></div>

    </div>

  </div>


  <script type="module" src="app.js"></script>

</body>
</html>
